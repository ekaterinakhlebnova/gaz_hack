services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: signals
      POSTGRES_PASSWORD: signals
      POSTGRES_DB: signals
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signals -d signals"]
      interval: 2s
      timeout: 5s
      retries: 15

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://signals:signals@db:5432/signals
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  bot:
    build: .
    command: python bot.py
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://signals:signals@db:5432/signals
      PYTHONUNBUFFERED: "1"
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

volumes:
  pgdata:
