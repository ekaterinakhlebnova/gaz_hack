services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: signals
      POSTGRES_PASSWORD: signals
      POSTGRES_DB: signals
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://signals:signals@db:5432/signals
    ports:
      - "8000:8000"
    depends_on:
      - db
    restart: on-failure

volumes:
  pgdata:
